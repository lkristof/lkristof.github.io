<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">LK icon for dark interface</title>
  <desc id="desc">White tile with a dark LK monogram.</desc>
  <defs>
    <linearGradient id="tileGradient" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f7f9fa"/>
      <stop offset="1" stop-color="#e7edf1"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="48%" cy="38%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#536875" stop-opacity="0.10"/>
    </radialGradient>
    <linearGradient id="edgeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c8d2d8"/>
      <stop offset="1" stop-color="#aab8c1"/>
    </linearGradient>
    <linearGradient id="letterGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263741"/>
