  <use href="#tileShape" fill="url(#tileGlow)"/>
  <g fill="#728590" opacity="0.36" transform="translate(5 7)"><use href="#letterL"/><use href="#letterK"/></g>
  <g fill="url(#letterGradient)" stroke="#ffffff" stroke-opacity="0.88" stroke-width="2.4" stroke-linejoin="miter" paint-order="stroke fill"><use href="#letterL"/><use href="#letterK"/></g>

