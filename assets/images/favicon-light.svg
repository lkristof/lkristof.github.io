<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LK icon for light interface</title>
  <desc id="desc">Dark tile with a white LK monogram.</desc>
  <defs>
    <linearGradient id="tileGradient" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#202d37"/>
      <stop offset="0.52" stop-color="#1b2731"/>
      <stop offset="1" stop-color="#17232c"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="48%" cy="38%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.07"/>
    </radialGradient>
    <linearGradient id="edgeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4954"/>
      <stop offset="0.55" stop-color="#121b22"/>
      <stop offset="1" stop-color="#0d151b"/>
    </linearGradient>
    <linearGradient id="letterGradient" x1="0" y1="0" x2="0" y2="1">
