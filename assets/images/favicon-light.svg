    <path id="tileShape" d="M 384 0 C 219 0 130 18 77 69 C 19 124 0 219 0 384 L 0 640 C 0 805 19 900 77 955 C 130 1006 219 1024 384 1024 L 640 1024 C 805 1024 894 1006 947 955 C 1005 900 1024 805 1024 640 L 1024 384 C 1024 219 1005 124 947 69 C 894 18 805 0 640 0 Z"/>
    <path id="letterL" d="M 204 242 H 291 V 692 H 519 L 594 773 H 204 Z"/>
    <path id="letterK" d="M 356 242 H 441 V 514 L 706 242 H 823 L 565 503 L 831 773 H 714 L 511 561 L 441 627 H 356 Z"/>
  </defs>
  <use href="#tileShape" fill="url(#tileGradient)" stroke="url(#edgeGradient)" stroke-width="3"/>
  <use href="#tileShape" fill="url(#tileGlow)"/>
  <g fill="#b8bdc0" opacity="0.78" transform="translate(5 7)"><use href="#letterL"/><use href="#letterK"/></g>
  <g fill="url(#letterGradient)" stroke="#111b22" stroke-width="2.4" stroke-linejoin="miter" paint-order="stroke fill"><use href="#letterL"/><use href="#letterK"/></g>
