<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">LK adaptive icon</title>
  <desc id="desc">Theme-aware rounded-square LK monogram that switches automatically between light and dark palettes.</desc>

  <style type="text/css"><![CDATA[
    #palette-light-theme { display: inline; }
    #palette-dark-theme  { display: none; }

    @media (prefers-color-scheme: dark) {
      #palette-light-theme { display: none; }
      #palette-dark-theme  { display: inline; }
    }
  ]]></style>

  <defs>
    <path id="tileShape" d="M 512 0 C 281.6 0 166.4 0 83.2 83.2 C 0 166.4 0 281.6 0 512 C 0 742.4 0 857.6 83.2 940.8 C 166.4 1024 281.6 1024 512 1024 C 742.4 1024 857.6 1024 940.8 940.8 C 1024 857.6 1024 742.4 1024 512 C 1024 281.6 1024 166.4 940.8 83.2 C 857.6 0 742.4 0 512 0 Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>

    <path id="letterL" d="M 204 242 H 291 V 692 H 519 L 594 773 H 204 Z"/>
    <path id="letterK" d="M 356 242 H 441 V 514 L 706 242 H 823 L 565 503 L 831 773 H 714 L 511 561 L 441 627 H 356 Z"/>

    <linearGradient id="darkTile" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#202d37"/>
      <stop offset="0.52" stop-color="#1b2731"/>
      <stop offset="1" stop-color="#17232c"/>
    </linearGradient>
    <radialGradient id="darkGlow" cx="48%" cy="38%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.07"/>
    </radialGradient>
    <linearGradient id="darkEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33414b"/>
      <stop offset="0.55" stop-color="#121b22"/>
      <stop offset="1" stop-color="#0d151b"/>
    </linearGradient>
    <linearGradient id="whiteLetters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.82" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f4"/>
    </linearGradient>

    <linearGradient id="whiteTile" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eef2f4"/>
    </linearGradient>
    <radialGradient id="whiteGlow" cx="48%" cy="36%" r="82%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.66" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#506572" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="whiteEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#dce3e7"/>
      <stop offset="1" stop-color="#c3ced4"/>
    </linearGradient>
    <linearGradient id="darkLetters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263640"/>
      <stop offset="0.82" stop-color="#17252e"/>
      <stop offset="1" stop-color="#0f1a21"/>
    </linearGradient>
  </defs>
  <g transform="scale(0.0625)" clip-path="url(#tileClip)">

  <!-- Light system theme: original dark tile with white monogram. -->
  <g id="palette-light-theme">
    <use href="#tileShape" fill="url(#darkTile)" stroke="url(#darkEdge)" stroke-width="3"/>
    <use href="#tileShape" fill="url(#darkGlow)"/>
    <g fill="#b8bdc0" opacity="0.78" transform="translate(5 7)">
      <use href="#letterL"/>
      <use href="#letterK"/>
    </g>
    <g fill="url(#whiteLetters)" stroke="#111b22" stroke-width="2.4" stroke-linejoin="miter" paint-order="stroke fill">
      <use href="#letterL"/>
      <use href="#letterK"/>
    </g>
  </g>

  <!-- Dark system theme: white tile with dark monogram. -->
  <g id="palette-dark-theme">
    <use href="#tileShape" fill="url(#whiteTile)" stroke="url(#whiteEdge)" stroke-width="3"/>
    <use href="#tileShape" fill="url(#whiteGlow)"/>
    <g fill="#81919a" opacity="0.32" transform="translate(5 7)">
      <use href="#letterL"/>
      <use href="#letterK"/>
    </g>
    <g fill="url(#darkLetters)" stroke="#ffffff" stroke-opacity="0.92" stroke-width="2.4" stroke-linejoin="miter" paint-order="stroke fill">
      <use href="#letterL"/>
      <use href="#letterK"/>
    </g>
  </g>

  </g>
</svg>
